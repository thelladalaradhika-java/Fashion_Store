<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading Premium Fashion Store...</title>
    <meta http-equiv="refresh" content="0; url=home">
    <style>
        body {
            background-color: #140924;
            color: #bb86fc;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(138, 43, 226, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #8a2be2;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Opening your premium fashion collection...</p>
    </div>
</body>
</html>
